services:
  alertnotify:
    container_name: alertnotify
    build:
      context: ./alertnotify
      dockerfile: ./Dockerfile
    image: alertnotify:latest
  automatedresponse:
    container_name: automatedresponse
    build:
      context: ./automatedresponse
      dockerfile: ./Dockerfile
    image: automatedresponse:latest
  identitymanagement:
    container_name: identitymanagement
    build:
      context: ./identitymanagement
      dockerfile: ./Dockerfile
    image: identitymanagement:latest
    ports:
      - '8082:8082'
    depends_on:
      sosoc-db:
        condition: service_healthy
        restart: true
  logmonitor:
    container_name: logmonitor
    build:
      context: ./logmonitor
      dockerfile: ./Dockerfile
    image: logmonitor:latest
    ports:
      - '8083:8083'
    depends_on:
      sosoc-db:
        condition: service_healthy
        restart: true
  playbookmanagement:
    container_name: playbookmanagement
    build:
      context: ./playbookmanagement
      dockerfile: ./Dockerfile
    image: playbookmanagement:latest
    ports:
      - '8084:8084'
    depends_on:
      sosoc-db:
        condition: service_healthy
        restart: true
  threatintelligence:
    container_name: threatintelligence
    build:
      context: ./threatintelligence
      dockerfile: ./Dockerfile
    image: threatintelligence:latest
    ports:
      - '8085:8085'
    depends_on:
      sosoc-db:
        condition: service_healthy
        restart: true
  sosoc-mq:
    container_name: sosoc-mq
    image: rmohr/activemq:latest
    ports:
      - "61616:61616"
      - "8161:8161"
  sosoc-db:
    container_name: sosoc-db
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
    volumes:
      - ../postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -c 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s
      timeout: 5s
