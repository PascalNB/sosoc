components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Firstname Lastname
        email:
          type: string
          format: email
        role:
          type: string
          example: analyst
        endpoints:
          type: array
          items:
            $ref: './endpoints.yaml#/components/schemas/Endpoint'
      required:
        - name
        - email
        - role
        - endpoints