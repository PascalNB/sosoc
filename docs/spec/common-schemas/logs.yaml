components:
  schemas:
    LogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        endpoint:
          $ref: './endpoints.yaml#/components/schemas/Endpoint'
        user:
          $ref: './users.yaml#/components/schemas/User'
          nullable: true
        data:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
