components:
  schemas:
    LogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        event:
          type: string
          example: email-received
        endpoint:
          $ref: './endpoints.yaml#/components/schemas/Endpoint'
        data:
          type: object
          additionalProperties: true