components:
  schemas:
    Step:
      type: object
      properties:
        type:
          type: string
          enum:
            - human
            - auto
        action:
          type: string
    Workflow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
