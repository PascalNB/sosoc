components:
  schemas:
    Endpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: client-1
        ip:
          oneOf:
            - type: string
              format: ipv4
            - type: string
              format: ipv6
        host:
          type: string
          format: hostname
          nullable: true