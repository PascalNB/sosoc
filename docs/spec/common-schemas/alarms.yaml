components:
  schemas:
    Alarm:
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: false
        timestamp:
          type: string
          format: date-time
          nullable: false
        threat:
          $ref: '#/components/schemas/Threat'
          nullable: false
        rule:
          $ref: './rules.yaml#/components/schemas/Rule'
          nullable: false
        data:
          type: object
          additionalProperties: true
          nullable: false
        ioc:
          type: object
          $ref: './iocs.yaml#/components/schemas/IOC'
          nullable: true
    Severity:
      type: string
      enum:
        - high
        - medium
        - low
        - no
    Threat:
      type: object
      properties:
        code:
          type: string
          example: phishing
          nullable: false
        severity:
          $ref: '#/components/schemas/Severity'
          nullable: false
        tactic:
          type: string
          example: ta0001
          nullable: true
        technique:
          type: string
          example: t1566.001
          nullable: true