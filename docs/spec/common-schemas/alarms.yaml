components:
  schemas:
    Alarm:
      type: object
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        threat:
          $ref: '#/components/schemas/Threat'
        rule:
          $ref: './rules.yaml#/components/schemas/Rule'
        data:
          type: object
          additionalProperties: true
        ioc:
          type: object
          $ref: './iocs.yaml#/components/schemas/IOC'
      required:
        - id
        - timestamp
        - threat
        - rule
        - data
    Severity:
      type: string
      enum:
        - high
        - medium
        - low
        - no
    Threat:
      type: object
      properties:
        code:
          type: string
          example: phishing
        severity:
          $ref: '#/components/schemas/Severity'
        tactic:
          type: string
          example: ta0001
        technique:
          type: string
          example: t1566.001
      required:
        - code
        - severity