components:
  schemas:
    Alarm:
      type: object
      properties:
        id:
          type: string
          format: uuid
        endpoint:
          $ref: './endpoints.yaml#/components/schemas/Endpoint'
        user:
          $ref: './users.yaml#/components/schemas/User'
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        message:
          type: string
        data:
          type: object
          additionalProperties: true