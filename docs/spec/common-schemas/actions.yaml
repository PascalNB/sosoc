components:
  schemas:
    Action:
      type: object
      properties:
        user:
          $ref: './users.yaml#/components/schemas/User'
        action:
          type: object
          properties:
            code:
              type: string
            data:
              type: object
              additionalProperties: true
          required:
            - code
            - data
      required:
        - user
        - action