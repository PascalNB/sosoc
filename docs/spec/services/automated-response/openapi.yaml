openapi: 3.1.0
info:
  title: Automated Response Service
  description: Takes automated actions when threats are detected.
    For example, disabling accounts, blocking network sources, or quarantining endpoint devices.
  version: 1.0.0
servers:
  - url: 'https'
paths:
  /responses:
    post:
      summary: Create a new response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                step:
                  $ref: '../../common-schemas/workflows.yaml#/components/schemas/Step'
                alarm:
                  $ref: '../../common-schemas/alarms.yaml#/components/schemas/Alarm'
        required: true