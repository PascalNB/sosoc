openapi: 3.1.0
info:
  title: Log Collection & Monitoring Service
  description: Receives logs from endpoints and responds based on automated detection rules.
  version: 1.0.0
servers:
  - url: 'localhost'
paths:
  /logs:
    get:
      summary: Get all log entries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../common-schemas/logs.yaml#/components/schemas/LogEntry'
    post:
      summary: Create a new log entry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../../common-schemas/logs.yaml#/components/schemas/LogEntry'
        required: true
  /logs/{id}:
    parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
        description: Log entry ID
    get:
      summary: Get a log entry
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../../common-schemas/logs.yaml#/components/schemas/LogEntry'
  /alarms/{id}:
    parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
        description: Alarm ID
    put:
      summary: Update an alarm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../../common-schemas/alarms.yaml#/components/schemas/Alarm'
        required: true
  /rules:
    get:
      summary: Get all rules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../common-schemas/rules.yaml#/components/schemas/Rule'
    post:
      summary: create a new rule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../../common-schemas/rules.yaml#/components/schemas/Rule'
        required: true
  /rules/{id}:
    parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
        description: Alarm ID
    get:
      summary: Get a rule
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../../common-schemas/rules.yaml#/components/schemas/Rule'
    put:
      summary: Modify a rule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../../common-schemas/rules.yaml#/components/schemas/Rule'
        required: true
    delete:
      summary: Delete a rule