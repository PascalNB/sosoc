openapi: 3.1.0
info:
  title: Security Playbook Management Service
  description: Manages the collection of incident response workflows for different kinds of incidents.
  version: 1.0.0
servers:
  - url: 'localhost'
paths:
  /alarms:
    post:
      operationId: postAlarm
      tags:
        - alarms
      summary: Send an alarm to identify incident response workflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../../common-schemas/alarms.yaml#/components/schemas/Alarm'
        required: true
      responses:
        '200':
          description: OK
  /playbooks:
    get:
      operationId: getPlaybooks
      tags:
        - playbooks
      summary: Get all playbooks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../common-schemas/playbooks.yaml#/components/schemas/Playbook'
    post:
      operationId: postPlaybook
      tags:
        - playbooks
      summary: Create a new playbook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../../common-schemas/playbooks.yaml#/components/schemas/Playbook'
        required: true
      responses:
        '200':
          description: OK
  /playbooks/{id}:
    parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
        description: Playbook ID
    get:
      operationId: getPlaybook
      tags:
        - playbooks
      summary: Get an existing playbook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../../common-schemas/playbooks.yaml#/components/schemas/Playbook'
    put:
      operationId: putPlaybook
      tags:
        - playbooks
      summary: Update an existing playbook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../../common-schemas/playbooks.yaml#/components/schemas/Playbook'
        required: true
      responses:
        '200':
          description: OK
    delete:
      operationId: deletePlaybook
      tags:
        - playbooks
      summary: Delete an existing playbook
      responses:
        '200':
          description: OK