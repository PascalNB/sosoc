apiVersion: apps/v1
kind: Deployment
metadata:
  name: sosoc-mq
  namespace: soa-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sosoc-mq
  template:
    metadata:
      labels:
        app: sosoc-mq
    spec:
      containers:
        - name: activemq
          image: rmohr/activemq:latest
          ports:
            - containerPort: 61616
            - containerPort: 8161
---
apiVersion: v1
kind: Service
metadata:
  name: sosoc-mq
  namespace: soa-project
spec:
  selector:
    app: sosoc-mq
  ports:
    - name: mq
      port: 61616
      targetPort: 61616
    - name: web
      port: 8161
      targetPort: 8161
  type: ClusterIP
