apiVersion: apps/v1
kind: Deployment
metadata:
  name: automatedresponse
  namespace: soa-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: automatedresponse
  template:
    metadata:
      labels:
        app: automatedresponse
    spec:
      containers:
        - name: automatedresponse
          image: automatedresponse:latest
          imagePullPolicy: Never
---
apiVersion: v1
kind: Service
metadata:
  name: automatedresponse
  namespace: soa-project
spec:
  selector:
    app: automatedresponse
  clusterIP: None  # uses message queue
