apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertnotify
  namespace: soa-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertnotify
  template:
    metadata:
      labels:
        app: alertnotify
    spec:
      containers:
        - name: alertnotify
          image: alertnotify:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: alertnotify-mail
---
apiVersion: v1
kind: Service
metadata:
  name: alertnotify
  namespace: soa-project
spec:
  selector:
    app: alertnotify
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
