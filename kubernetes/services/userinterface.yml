apiVersion: apps/v1
kind: Deployment
metadata:
  name: userinterface
  namespace: soa-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userinterface
  template:
    metadata:
      labels:
        app: userinterface
    spec:
      containers:
        - name: userinterface
          image: userinterface:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          #ToDo: get rid of these
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://sosoc-db:5432/postgres
            - name: SPRING_DATASOURCE_USERNAME
              value: admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: admin

---
apiVersion: v1
kind: Service
metadata:
  name: userinterface
  namespace: soa-project
spec:
  type: ClusterIP
  selector:
    app: userinterface
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

